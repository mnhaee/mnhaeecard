<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mohamed Nagi Hassan</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --bg:#f2f4f7; --card:#ffffff; --text:#161a1f; --muted:#6b7280;
    --accent:#2f6feb; --accent2:#1f4fb0; --border:#e6e8ec;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1115; --card:#1a1d23; --text:#f2f3f5; --muted:#9aa1ac; --border:#2a2e36;
    }
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;}
  body{
    height:100%;margin:0;background:var(--bg);color:var(--text);
    font-family:'Segoe UI',Tahoma,Arial,sans-serif;
    display:flex;justify-content:center;padding:24px 14px;
  }
  #app{width:100%;max-width:420px;}
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:18px;
    padding:26px 22px;box-shadow:0 4px 18px rgba(0,0,0,.08);
  }
  .avatar{
    width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;font-weight:700;
    margin:0 auto 14px;overflow:hidden;
  }
  .avatar img{width:100%;height:100%;object-fit:cover;}
  h1{font-size:20px;margin:0 0 2px;text-align:center;}
  .role{color:var(--muted);text-align:center;font-size:14px;margin:0 0 2px;}
  .company{color:var(--accent);text-align:center;font-size:13px;font-weight:600;margin:0 0 18px;line-height:1.4;}
  .row{display:flex;align-items:center;gap:10px;padding:10px 8px;border-top:1px solid var(--border);font-size:14px;}
  .row:first-of-type{border-top:none;}
  .row .ic{width:20px;text-align:center;flex-shrink:0;}
  .row .lbl{color:var(--muted);font-size:11px;display:block;}
  .row a{color:var(--text);text-decoration:none;word-break:break-all;}
  .qr-wrap{
    display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:20px;
    padding-top:18px;border-top:1px dashed var(--border);
  }
  .qr-wrap img,.qr-wrap canvas{border-radius:10px;background:#fff;padding:8px;}
  .qr-hint{font-size:12px;color:var(--muted);text-align:center;}
  .downloadbtn{
    margin-top:6px;padding:10px 20px;border-radius:10px;border:none;
    background:var(--accent);color:#fff;font-size:13px;font-weight:600;cursor:pointer;
  }
  .contactbtn{
    display:block;width:100%;margin-top:14px;padding:12px;border-radius:10px;border:none;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
    font-size:14px;font-weight:600;cursor:pointer;
  }
  .share-row{display:flex;gap:8px;margin-top:10px;}
  .share-row button{
    flex:1;padding:10px 4px;border-radius:9px;border:1px solid var(--border);
    background:var(--card);color:var(--text);font-size:12px;font-weight:600;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;
  }
  .share-row button .emo{font-size:16px;}
  .share-row button.copied{border-color:var(--accent);color:var(--accent);}
</style>
</head>
<body>
<div id="app">
  <div class="card" id="cardBox"></div>
  <button class="contactbtn" id="contactBtn">Save Contact</button>
  <div class="share-row">
    <button id="shareBtn"><span class="emo">📤</span>Share</button>
    <button id="copyBtn"><span class="emo">🔗</span>Copy Link</button>
    <button id="waShareBtn"><span class="emo">💬</span>WhatsApp</button>
  </div>
  <div class="qr-wrap">
    <div id="qrcode"></div>
    <div class="qr-hint">Scan to save contact info</div>
    <button class="downloadbtn" id="downloadBtn">Save</button>
  </div>
</div>

<script>
function loadData(){
  try{ return JSON.parse(document.getElementById('card-data').textContent); }
  catch(e){ return {}; }
}
function initials(name){
  if(!name) return "?";
  const parts = name.trim().split(/\s+/);
  return (parts[0]?.[0]||"") + (parts[1]?.[0]||"");
}
function esc(s){
  const d = document.createElement('div'); d.textContent = s ?? ""; return d.innerHTML;
}
function waLink(num, data){
  const digits = (num||"").replace(/[^\d]/g,"");
  if(!digits) return "";
  if(data){
    const firstName = (data.name||"").trim().split(/\s+/)[0] || "";
    const msg = `مرحباً محمد، اطلعت على بطاقتك الرقمية، ويسعدني التواصل معك \u{1F64F}\nHello ${firstName}, I came across your digital business card and would be glad to connect with you \u{1F64F}`;
    return `https://wa.me/${digits}?text=${encodeURIComponent(msg)}`;
  }
  return `https://wa.me/${digits}`;
}
function renderCard(data){
  const box = document.getElementById('cardBox');
  const order = [
    {k:"phone_personal", label:"Personal", icon:"\ud83d\udcde"},
    {k:"phone_work", label:"Work", icon:"\ud83d\udcbc"},
    {k:"phone_egypt", label:"Egypt", icon:"\ud83c\uddea\ud83c\uddec"},
    {k:"whatsapp", label:null, icon:"\ud83d\udcac"},
    {k:"email", label:null, icon:"\u2709\ufe0f"},
    {k:"linkedin", label:null, icon:"\ud83d\udd17"},
    {k:"website", label:null, icon:"\ud83c\udf10"},
    {k:"address", label:null, icon:"\ud83d\udccd"},
  ];
  let rows = "";
  order.forEach(f=>{
    const v = data[f.k];
    if(!v) return;
    let inner = esc(v);
    if(f.k.startsWith("phone")) inner = `<a href="tel:${esc(v.replace(/\s+/g,""))}">${esc(v)}</a>`;
    if(f.k==="whatsapp") inner = `<a href="${esc(waLink(v, data))}" target="_blank" rel="noopener">Chat on WhatsApp</a>`;
    if(f.k==="email") inner = `<a href="mailto:${esc(v)}">${esc(v)}</a>`;
    if(f.k==="linkedin") inner = `<a href="${esc(v)}" target="_blank" rel="noopener">LinkedIn Profile</a>`;
    if(f.k==="website") inner = `<a href="${esc(v)}" target="_blank" rel="noopener">${esc(v)}</a>`;
    const lbl = f.label ? `<span class="lbl">${f.label}</span>` : "";
    rows += `<div class="row"><span class="ic">${f.icon}</span><span>${lbl}${inner}</span></div>`;
  });
  const avatarInner = data.photo ? `<img src="${data.photo}" alt="">` : esc(initials(data.name));
  box.innerHTML = `
    <div class="avatar">${avatarInner}</div>
    <h1>${esc(data.name||"")}</h1>
    <p class="role">${esc(data.role||"")}</p>
    <p class="company">${esc(data.company||"")}</p>
    ${rows}
  `;
}
function renderQR(){
  const el = document.getElementById('qrcode');
  el.innerHTML = "";
  new QRCode(el, { text: window.location.href, width: 170, height: 170, correctLevel: QRCode.CorrectLevel.M });
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawAvatar(ctx, data, cx, cy, r){
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.closePath();
  ctx.clip();
  if(data.photo){
    const img = new Image();
    img.src = data.photo;
    ctx.drawImage(img, cx-r, cy-r, r*2, r*2);
  } else {
    const grad = ctx.createLinearGradient(cx-r, cy-r, cx+r, cy+r);
    grad.addColorStop(0, "#2f6feb");
    grad.addColorStop(1, "#1f4fb0");
    ctx.fillStyle = grad;
    ctx.fillRect(cx-r, cy-r, r*2, r*2);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 40px 'Segoe UI',Arial,sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(initials(data.name), cx, cy+2);
  }
  ctx.restore();
}

async function buildShareCanvas(data){
  const W = 1290, H = 2796; // matches iPhone Pro Max / Galaxy Ultra display ratio (~19.5:9)
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  // full-bleed background
  const bgGrad = ctx.createLinearGradient(0, 0, W, H);
  bgGrad.addColorStop(0, "#0b0f1a");
  bgGrad.addColorStop(0.55, "#111827");
  bgGrad.addColorStop(1, "#0b0f1a");
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // soft decorative glows so it reads as a wallpaper, not a card
  function glow(x,y,r,color){
    const g = ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0, color);
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
  }
  glow(W*0.15, H*0.08, 520, "rgba(47,111,235,0.35)");
  glow(W*0.9, H*0.92, 560, "rgba(31,79,176,0.30)");

  // content anchor (kept off dead-center-bottom so phone docks/icons don't cover it)
  const y0 = 1300;
  const avatarCenterY = y0 - 380;
  const avatarR = 130;

  if(data.photo){
    await new Promise(res=>{
      const img = new Image();
      img.onload = ()=>{ drawAvatar(ctx, data, W/2, avatarCenterY, avatarR); res(); };
      img.onerror = res;
      img.src = data.photo;
    });
  } else {
    drawAvatar(ctx, data, W/2, avatarCenterY, avatarR);
  }
  // thin ring around avatar
  ctx.beginPath();
  ctx.arc(W/2, avatarCenterY, avatarR+6, 0, Math.PI*2);
  ctx.strokeStyle = "rgba(255,255,255,0.25)";
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.textAlign = "center";
  ctx.fillStyle = "#f9fafb";
  ctx.font = "bold 56px 'Segoe UI',Arial,sans-serif";
  const nameY = avatarCenterY + 200;
  ctx.fillText(data.name||"", W/2, nameY);

  ctx.fillStyle = "#9ca3af";
  ctx.font = "32px 'Segoe UI',Arial,sans-serif";
  const roleY = nameY + 55;
  ctx.fillText(data.role||"", W/2, roleY);

  ctx.fillStyle = "#5b8def";
  ctx.font = "600 26px 'Segoe UI',Arial,sans-serif";
  const companyY = roleY + 55;
  wrapCenteredText(ctx, data.company||"", W/2, companyY, 980, 34);

  // white QR panel
  const panelSize = 480;
  const panelX = (W - panelSize)/2;
  const panelY = companyY + 100;
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,.4)";
  ctx.shadowBlur = 40;
  ctx.shadowOffsetY = 16;
  ctx.fillStyle = "#ffffff";
  roundRect(ctx, panelX, panelY, panelSize, panelSize, 32);
  ctx.fill();
  ctx.restore();

  const qrCanvas = document.querySelector('#qrcode canvas');
  const qrSize = 380;
  if(qrCanvas){
    ctx.drawImage(qrCanvas, panelX + (panelSize-qrSize)/2, panelY + (panelSize-qrSize)/2, qrSize, qrSize);
  }

  ctx.fillStyle = "#d1d5db";
  ctx.font = "26px 'Segoe UI',Arial,sans-serif";
  ctx.fillText("Scan to save my contact info", W/2, panelY + panelSize + 65);

  ctx.fillStyle = "#6b7280";
  ctx.font = "22px 'Segoe UI',Arial,sans-serif";
  ctx.fillText(window.location.href.replace(/^https?:\/\//,""), W/2, panelY + panelSize + 105);

  return canvas;
}

function wrapCenteredText(ctx, text, cx, y, maxWidth, lineHeight){
  const words = text.split(" ");
  let line = "", lines = [];
  words.forEach(w=>{
    const test = line ? line + " " + w : w;
    if(ctx.measureText(test).width > maxWidth && line){
      lines.push(line); line = w;
    } else { line = test; }
  });
  if(line) lines.push(line);
  lines.forEach((l,i)=> ctx.fillText(l, cx, y + i*lineHeight));
}

function foldLine(line){
  // vCard 3.0 line folding: max 75 octets per line, continuation starts with a space
  const bytes = new TextEncoder().encode(line);
  if(bytes.length <= 75) return line;
  let out = "", chunkStart = 0;
  while(chunkStart < line.length){
    let end = chunkStart + 73; // leave room, roughly
    let chunk = line.slice(chunkStart, end);
    out += (chunkStart === 0 ? "" : "\r\n ") + chunk;
    chunkStart = end;
  }
  return out;
}

function buildVCard(data){
  const nameParts = (data.name||"").trim().split(/\s+/);
  const first = nameParts[0] || "";
  const last = nameParts.slice(1).join(" ") || "";
  const lines = [];
  lines.push("BEGIN:VCARD");
  lines.push("VERSION:3.0");
  lines.push(`N:${last};${first};;;`);
  lines.push(`FN:${data.name||""}`);
  if(data.company) lines.push(`ORG:${data.company}`);
  if(data.role) lines.push(`TITLE:${data.role}`);
  if(data.phone_personal) lines.push(`TEL;TYPE=CELL:${data.phone_personal}`);
  if(data.phone_work) lines.push(`TEL;TYPE=WORK:${data.phone_work}`);
  if(data.phone_egypt) lines.push(`TEL;TYPE=HOME:${data.phone_egypt}`);
  if(data.whatsapp) lines.push(`NOTE:WhatsApp: ${waLink(data.whatsapp)}`);
  if(data.email) lines.push(`EMAIL;TYPE=INTERNET:${data.email}`);
  if(data.website) lines.push(`URL;TYPE=WORK:${data.website}`);
  if(data.linkedin) lines.push(`URL;TYPE=LinkedIn:${data.linkedin}`);
  if(data.address) lines.push(`ADR;TYPE=WORK:;;${data.address};;;;`);
  if(data.photo){
    const b64 = data.photo.split(",")[1] || "";
    lines.push(`PHOTO;ENCODING=b;TYPE=JPEG:${b64}`);
  }
  lines.push("END:VCARD");
  return lines.map(foldLine).join("\r\n");
}

function shareMessage(data){
  const name = data.name || "";
  const url = window.location.href;
  return `مرحباً، ده كارتي الرقمي 👇\nHi, here's my digital business card 👇\n${name}\n${url}`;
}

document.getElementById('shareBtn').addEventListener('click', async ()=>{
  const data = loadData();
  const text = shareMessage(data);
  if(navigator.share){
    try{
      await navigator.share({ title: data.name||"Digital Card", text: text, url: window.location.href });
    }catch(e){ /* user cancelled, ignore */ }
  } else {
    try{
      await navigator.clipboard.writeText(text);
      const btn = document.getElementById('shareBtn');
      const prev = btn.innerHTML;
      btn.innerHTML = '<span class="emo">✅</span>Copied';
      setTimeout(()=> btn.innerHTML = prev, 1600);
    }catch(e){
      alert(text);
    }
  }
});

document.getElementById('copyBtn').addEventListener('click', async ()=>{
  const btn = document.getElementById('copyBtn');
  try{
    await navigator.clipboard.writeText(window.location.href);
    btn.classList.add('copied');
    const prev = btn.innerHTML;
    btn.innerHTML = '<span class="emo">✅</span>Copied';
    setTimeout(()=>{ btn.innerHTML = prev; btn.classList.remove('copied'); }, 1600);
  }catch(e){
    prompt("Copy this link:", window.location.href);
  }
});

document.getElementById('waShareBtn').addEventListener('click', ()=>{
  const data = loadData();
  const text = shareMessage(data);
  window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
});

document.getElementById('contactBtn').addEventListener('click', ()=>{
  const data = loadData();
  const vcf = buildVCard(data);
  const blob = new Blob([vcf], {type:"text/vcard;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  const safeName = (data.name||"contact").replace(/\s+/g,"-");
  link.download = `${safeName}.vcf`;
  link.href = url;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  setTimeout(()=> URL.revokeObjectURL(url), 3000);
});

document.getElementById('downloadBtn').addEventListener('click', async ()=>{
  const btn = document.getElementById('downloadBtn');
  btn.disabled = true;
  const prevText = btn.textContent;
  btn.textContent = "Preparing...";
  try{
    const canvas = await buildShareCanvas(loadData());
    const link = document.createElement('a');
    link.download = "mohamed-nagi-qr-wallpaper.png";
    link.href = canvas.toDataURL('image/png');
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }catch(e){
    alert("Couldn't generate the image, please try again.");
  }
  btn.disabled = false;
  btn.textContent = prevText;
});

renderCard(loadData());
renderQR();
</script>
